name: Basic

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest

      - name: Show versions
        run: xcodebuild -version

      - name: Create iPhone 13 simulator
        id: sim
        run: |
          set -euo pipefail
          # Newest available iOS runtime on the runner.
          runtime=$(xcrun simctl list runtimes available -j | python3 -c "import sys, json; rs=[r for r in json.load(sys.stdin)['runtimes'] if r['platform']=='iOS' and r.get('isAvailable')]; rs.sort(key=lambda r: [int(x) for x in r['version'].split('.')]); print(rs[-1]['identifier'])")
          # iPhone 13 device type (not pre-created on the runner image, so we create it).
          devtype=$(xcrun simctl list devicetypes -j | python3 -c "import sys, json; ts=[t for t in json.load(sys.stdin)['devicetypes'] if t['name']=='iPhone 13']; print(ts[0]['identifier'] if ts else '')")
          if [ -z "$devtype" ]; then
            echo "::error::iPhone 13 device type is not available in this Xcode. Available device types:"
            xcrun simctl list devicetypes
            exit 1
          fi
          echo "Creating iPhone 13 on runtime $runtime"
          udid=$(xcrun simctl create 'iPhone 13 (CI)' "$devtype" "$runtime")
          echo "Created simulator $udid"
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      - name: Build & Test
        run: |
          set -o pipefail
          # Ad-hoc sign ("Sign to Run Locally") for the simulator so the app's
          # keychain-access-groups entitlement is actually applied. Fully
          # disabling code signing strips entitlements, which makes SecItemAdd
          # fail with errSecMissingEntitlement on newer iOS simulators and
          # breaks the Keychain tests. Manual style + empty team avoids the
          # automatic-signing profile lookup that has no credentials on CI.
          xcodebuild test \
            -project ShortcutsQL.xcodeproj \
            -scheme ShortcutsQL \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_REQUIRED=NO \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER=""
